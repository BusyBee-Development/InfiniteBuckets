# =================================================================== #
#                                                                     #
#                   InfiniteBuckets - Buckets Storage                 #
#                                                                     #
# =================================================================== #
# This file stores all your custom infinite buckets.
# It is recommended to use the in-game /ib builder to manage these.

buckets:
  water_infinite:
    display-name: "<aqua>Infinite Water Bucket</aqua>"
    lore:
      - "<gray>Never runs out!</gray>"
      - "<gray>Right-click to place water</gray>"
    liquid-type: WATER
    mode: VANILLA_LIKE
    usage-limit: -1
    cooldown: 0
    permission: "infinitebuckets.use.water"
    glowing: true
    custom-model-data: 0
    place-sound: ITEM_BUCKET_EMPTY
    refill-sound: ITEM_BUCKET_FILL
    icon: WATER_BUCKET
  lava_infinite:
    display-name: "<red>Infinite Lava Bucket</red>"
    lore:
      - "<gray>Never runs out!</gray>"
      - "<gray>Right-click to place lava</gray>"
    liquid-type: LAVA
    mode: VANILLA_LIKE
    usage-limit: -1
    cooldown: 0
    permission: "infinitebuckets.use.lava"
    glowing: true
    custom-model-data: 0
    place-sound: ITEM_BUCKET_EMPTY
    refill-sound: ITEM_BUCKET_FILL
    icon: LAVA_BUCKET