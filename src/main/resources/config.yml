# =================================================================== #
#                                                                     #
#                   InfiniteBuckets - Main Configuration              #
#                                                                     #
# =================================================================== #

# Enable debug mode to see more detailed logs in the console.
# Recommended to keep this false unless troubleshooting.
debug-mode: false

# Performance settings
performance:
  # The maximum number of blocks that can be drained in a single use.
  # Higher values may impact server performance.
  max-drain-blocks: 100
  # Should the plugin use asynchronous processing for block updates?
  # This is recommended for performance on Folia/Paper.
  async-processing: true

# Global cooldown between bucket uses (in milliseconds).
# This applies to all custom buckets unless a specific cooldown is set.
global-cooldown: 0

# Hooks integration
integrations:
  # Should the plugin automatically detect and enable protection hooks?
  auto-detect-hooks: true
  # Manually enable or disable specific hooks.
  hooks:
    worldguard: true
    lands: true
    bentobox: true
    superiorskyblock: true

# Database settings
# Use SQLITE for local storage or MYSQL for network-wide persistence.
database:
  type: "SQLITE"
  mysql:
    host: "localhost"
    port: 3306
    database: "infinitebuckets"
    username: "root"
    password: ""
    use-ssl: false
    pool-settings:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
      connection-timeout: 5000

# World-specific settings
world-settings:
  # List of worlds where infinite buckets are completely disabled.
  disabled-worlds: []
  
  # Should buckets be restricted in the Nether by default?
  # (e.g., placing water in the Nether)
  default-nether-restriction: true
  
  # Custom rules for specific worlds.
  world-rules:
    world_nether:
      allow-water: false
      allow-lava: true
