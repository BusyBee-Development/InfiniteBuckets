# =================================================================== #
#                                                                     #
#                   InfiniteBuckets - Language File                   #
#                                                                     #
# =================================================================== #
# For help with formatting (colors, gradients, etc.), please refer to
# the MiniMessage documentation: https://docs.advntr.dev/minimessage/format.html

# The prefix that appears before most plugin messages.
plugin-prefix: "<gold><b>InfiniteBuckets</b></gold> <dark_gray>»</dark_gray> "

# General Messages
no-permission-command: "<red>You do not have permission to use this command.</red>"
no-permission-use: "<gray>You do not have permission to use the <bucket_name><gray>.</gray>"
no-island-permission: "<red>You do not have permission to build here.</red>"
nether-disabled: "<red>This bucket is disabled in the Nether.</red>"
world-disabled: "<red>Infinite buckets are disabled in this world.</red>"
bucket-disabled-world: "<red>This bucket is disabled in this world.</red>"
reload-success: "<gray>Plugin configuration has been successfully reloaded.</gray>"

# GUI Messages
gui:
  prompts:
    enter-name: "<yellow>Please type the new display name in chat. Type <white>'cancel'</white> to stop."
    enter-lore: "<yellow>Type the lore lines. Use <white>'|'</white> for new lines. Type <white>'cancel'</white> to stop."
    name-updated: "<green>Display name updated to: <name>"
    lore-updated: "<green>Lore updated!"
    invalid-format: "<red>Invalid format! Please check your color tags."
    cancelled: "<red>Editing cancelled."
  status:
    saved: "<green>Bucket successfully saved to config!"
    deleted: "<red>Bucket has been removed."
  cooldown:
    active: "<red>You must wait <seconds>s before using <bucket_name> again."

# Bucket Logic Messages
drain-success: "<green>Successfully drained <aqua><blocks_drained></aqua> blocks with the <bucket_name><green>."
bucket-no-uses: "<red>The <bucket_name><red> has no uses left.</red>"
bucket-depleted: "<gray>Your <bucket_name><gray> has been depleted.</gray>"
dispenser-no-limited-uses: "<red>Limited-use buckets cannot be dispensed.</red>"

# Command Messages
give:
  sender: "<gray>You have given <#00E1FF><player></#00E1FF> <white><amount>x</white> <bucket_name><gray>.</gray>"
  receiver: "<gray>You have received <white><amount>x</white> <bucket_name><gray>.</gray>"
  player-not-found: "<red>Player not found: <player>.</red>"
  invalid-bucket: "<red>Invalid bucket type specified: <bucket>.</red>"
  invalid-amount: "<red>The amount must be a positive number.</red>"

# Help Menu
help-menu:
  - ""
  - " <gold><b>InfiniteBuckets Help</b></gold>"
  - " <gray>» <aqua>/ib builder</aqua> <dark_gray>- Open the bucket builder GUI</dark_gray>"
  - " <gray>» <aqua>/ib list</aqua> <dark_gray>- Open the created buckets list</dark_gray>"
  - " <gray>» <aqua>/ib give <player> <bucket> [amount]</aqua> <dark_gray>- Give a bucket to a player</dark_gray>"
  - " <gray>» <aqua>/ib reload</aqua> <dark_gray>- Reload all configurations</dark_gray>"
  - ""

# Update Notifications
update-notifier:
  - ""
  - " <gold><b>InfiniteBuckets Update Available</b></gold>"
  - " <gray>A new version is available! <dark_gray>(Current: v<current_version>)</dark_gray>"
  - " <green>»</green> <white>Latest: <gold><b>v<new_version></b></gold>"
  - " <aqua><i><click:open_url:'https://modrinth.com/plugin/infinitebuckets/versions'><hover:show_text:'<gray>Click to open download page.'>Click here to download the update.</hover></click></i></aqua>"
  - ""
