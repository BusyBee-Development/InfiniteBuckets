name: InfiniteBuckets
version: ${project.version}
main: net.busybee.InfiniteBuckets.Main
api-version: '1.21'
folia-supported: true
authors: [ djtmk ]
description: Provides customizable infinite water and lava buckets.
website: https://modrinth.com/plugin/infinitebuckets

softdepend:
  - SuperiorSkyblock2
  - WorldGuard
  - Lands
  - BentoBox

commands:
  infinitebuckets:
    description: Main command for InfiniteBuckets.
    aliases: [infb, ib]

permissions:
  infinitebuckets.admin:
    description: Allows access to all admin commands and GUIs.
    default: op
  infinitebuckets.use.water:
    description: Allows use of the infinite water bucket.
    default: true
  infinitebuckets.use.lava:
    description: Allows use of the infinite lava bucket.
    default: true
